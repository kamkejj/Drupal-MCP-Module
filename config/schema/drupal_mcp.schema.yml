drupal_mcp.settings:
  type: config_object
  label: 'Drupal MCP settings'
  mapping:
    resource_uri:
      type: string
      label: 'Canonical MCP resource URI'
    resource_binding:
      type: string
      label: 'Resource audience binding policy'
      constraints:
        AllowedValues:
          - audit
          - require
    allowed_hosts:
      type: sequence
      label: 'Additional allowed hosts'
      sequence:
        type: string
    allowed_origins:
      type: sequence
      label: 'Allowed CORS origins'
      sequence:
        type: string
    limits:
      type: mapping
      label: 'Limits'
      mapping:
        page_size:
          type: integer
          label: 'Maximum page size for list tools'
        max_body_bytes:
          type: integer
          label: 'Maximum request body size in bytes'
        session_ttl:
          type: integer
          label: 'MCP session time-to-live in seconds'
        idempotency_ttl:
          type: integer
          label: 'Mutation idempotency time-to-live in seconds'
        flood_limit:
          type: integer
          label: 'Allowed requests per flood window per user and consumer'
        flood_window:
          type: integer
          label: 'Flood control window in seconds'
    families:
      type: mapping
      label: 'Enabled tool families'
      mapping:
        site:
          type: boolean
        entity_schema:
          type: boolean
        content:
          type: boolean
        taxonomy:
          type: boolean
        blocks:
          type: boolean
        menus:
          type: boolean
        aliases:
          type: boolean
        files:
          type: boolean
        users:
          type: boolean
        drush:
          type: boolean
        database:
          type: boolean
        node_mutation:
          type: boolean
        taxonomy_mutation:
          type: boolean
        configuration_mutation:
          type: boolean
    content:
      type: mapping
      label: 'Content exposure'
      mapping:
        bundles:
          type: sequence
          label: 'Readable node bundles'
          sequence:
            type: string
        writable_bundles:
          type: sequence
          label: 'Writable node bundles'
          sequence:
            type: string
    taxonomy:
      type: mapping
      label: 'Taxonomy exposure'
      mapping:
        vocabularies:
          type: sequence
          label: 'Readable vocabularies'
          sequence:
            type: string
        writable_vocabularies:
          type: sequence
          label: 'Writable vocabularies'
          sequence:
            type: string
        allow_term_delete:
          type: boolean
          label: 'Allow permanent term deletion'
    configuration:
      type: mapping
      label: 'Configuration creation'
      mapping:
        field_targets:
          type: sequence
          label: 'Approved field targets (entity_type:bundle)'
          sequence:
            type: string
        field_types:
          type: sequence
          label: 'Approved field plugin types'
          sequence:
            type: string
    drush:
      type: mapping
      label: 'Drush diagnostics'
      mapping:
        commands:
          type: sequence
          label: 'Approved Drush command IDs'
          sequence:
            type: string
        config_names:
          type: sequence
          label: 'Configuration object names config:get may read'
          sequence:
            type: string
    database:
      type: mapping
      label: 'Database inspection'
      mapping:
        surfaces:
          type: sequence
          label: 'Approved database surfaces'
          sequence:
            type: string
