# Default configuration for the Drupal MCP server. Everything fails closed:
# mutation and diagnostics families are off, and every allowlist is empty
# except the Standard install's "tags" vocabulary.

# Canonical RFC 8707 resource URI. Its host is always an allowed Host.
resource_uri: 'https://drupalmcp.ddev.site/mcp'
# "require" rejects tokens not bound to resource_uri; "audit" only logs.
resource_binding: 'require'
# Additional hosts beyond the resource_uri host.
allowed_hosts: { }
# Browser origins allowed by CORS. Non-browser clients are unaffected.
allowed_origins: { }
limits:
  page_size: 20
  max_body_bytes: 1048576
  session_ttl: 3600
  idempotency_ttl: 86400
  flood_limit: 240
  flood_window: 3600
families:
  site: true
  entity_schema: true
  content: true
  taxonomy: true
  blocks: true
  menus: true
  aliases: true
  files: true
  users: true
  drush: false
  database: false
  node_mutation: false
  taxonomy_mutation: false
  configuration_mutation: false
content:
  bundles: { }
  # Must also be listed in bundles.
  writable_bundles: { }
taxonomy:
  vocabularies:
    - tags
  # Must also be listed in vocabularies.
  writable_vocabularies: { }
  allow_term_delete: false
configuration:
  # "node:bundle" or "taxonomy_term:vocabulary".
  field_targets: { }
  field_types: { }
drush:
  commands: { }
  config_names: { }
database:
  surfaces: { }
